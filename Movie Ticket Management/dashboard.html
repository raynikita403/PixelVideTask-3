<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/styles/dasboard.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navbar -->
            <nav class="col-md-3  custom-navbar col-lg-2 bg-light navbar navbar-expand-lg navbar-light bg-dark d-md-flex flex-column min-vh-100 ">
                <span class="text-danger top-0 position-relative movieflix">MOVIEFLIX</span>
                <div class="d-flex flex-column mt-4 ">
                   
                    <div>
                        <button class="navbar-toggler custom-toggler" type="button" data-toggle="collapse"
                            data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                            aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                    </div>
                    
                    <div class="collapse navbar-collapse w-100 mt-4" id="navbarNav">
                      
                        <ul class="navbar-nav flex-column w-100">

                            <li class="nav-item active  ">
                                <a class="nav-link mt-3 text-light text-danger fw-bold" href="#" id="Movies">
                                    <i class="bi bi-film"></i>
                                   Movie List</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link mt-3 text-light text-danger fw-bold" href="#" id="Theater">
                                    <i class="bi bi-building"></i> Theater</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link mt-3 text-light fw-bold " href="#"
                                    id="update-link"><i class="bi bi-camera-reels"></i> Movie Shows</a>
                            </li>

                            <li class="nav-item nav-item-hover" >
                                <a class="nav-link mt-3 text-light fw-bold " href="#" id="display-link">
                                    <i class="bi bi-ticket-perforated"></i> 
                                   Booking Details
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 col-lg-10 ms-auto px-4" id="main-content">


              
                <div class="py-4 content-section" id="movie-list">
                    <div class="container ">
                        <div class="d-flex justify-content-end flex-wrap">
                            <button class="btn btn-link nav-link category-link active text-danger fw-bolder "  id="all-category" type="button">All</button>
                            <button class="btn btn-link nav-link category-link text-danger fw-bolder " id="bollywood" data-category-id="2" type="button">Bollywood</button>
                            <button class="btn btn-link nav-link category-link text-danger fw-bolder" id="hollywood" data-category-id="1" type="button">Hollywood</button>
                            <button class="btn btn-link nav-link category-link text-danger fw-bolder" id="Tollywood" data-category-id="3" type="button">Tollywood</button>
                        </div>
                    </div>

                      <div id="movieContainer" class="d-flex flex-wrap justify-content-center mt-4 border-3 shadow-lg "></div>
                           
                      </div>
                
                </div>


            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
   
</body>

</html>
