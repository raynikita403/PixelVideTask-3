<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19_Feb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.2/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.2/dist/sweetalert2.all.min.js"></script>

    <link rel="stylesheet" href="/assets/styles/dasboard.css">
</head>

<body>

    <div class="container mt-5" id="showTableContainer">


        <h4 class="mb-3">Movie Shows</h4>

        <div class="table-responsive">
            <table class="table table-striped table-hover shadow">
                <thead class="thead-dark">
                    <tr>
                        <th>SNo</th>
                        <th>Movie Name</th>
                        <th>Theater</th>
                        <th>Location</th>
                        <th>Show Time</th>
                        <th>Price (₹)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="showTableBody">

                </tbody>
            </table>
        </div>
    </div>
    <div> <button class="btn btn-success btn-sm rounded-circle shadow position-fixed bottom-0 end-0 m-4"
            data-bs-toggle="modal" data-bs-target="#addMovieShow">
            <i class="bi bi-plus fs-5"></i>
        </button>
    </div>
    <!-- Modal -->
    <div class="modal fade" id="addMovieShow" tabindex="-1" aria-labelledby="addMovieShowLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header bg-dark text-danger">
                    <h5 class="modal-title" id="addMovieShowLabel">Add Movie Show</h5>
                    <button type="button" class="btn-close bg-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <form id="movieShowForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="movieCategory" class="form-label  ms-2">Movie Category</label>
                            <select class="form-select" id="movieCategory" name="movie_category" required>
                                <option value="">Select Category</option>
                                <option value="1">Hollywood</option>
                                <option value="2">Bollywood</option>
                                <option value="3">Tollywood</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="movieSelect" class="form-label ms-2">Select Movie</label>
                            <select class="form-select" id="movieSelect" name="movie_id" required>
                                <option value="">Select a movie</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label ms-2">Select Theaters</label>
                            <div id="theaterCheckboxes">

                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label  ms-2">Select Show Times</label>
                            <div id="showTimeCheckboxes"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label ms-2">Price</label>
                            <input type="text" class="form-control" id="price" name="price" required>
                        </div>

                    </div>

                    <div class="modal-footer bg-dark">
                        <button type="submit" class="btn btn-success text-light">ADD</button>
                        <button type="button" class="btn btn-secondary text-light"
                            data-bs-dismiss="modal">Cancel</button>
                    </div>

                </form>

            </div>
        </div>
    </div>


    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="assets/js/movie_shows.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   

</body>

</html>
